<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitPulse Explorer - Compare Repositories</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">⚡ GitPulse Explorer</div>
    <nav class="nav-links">
      <a href="#" class="active">Search Engine</a>
      <a href="#">Platform Features</a>
      <a href="#">Metrics</a>
      <a href="#">Connect</a>
    </nav>
  </header>

  <main class="container">
    <div class="tab-group" role="tablist" aria-label="Explorer Navigation">
      <button role="tab" aria-selected="false" class="tab-btn">🔍 Search Repositories</button>
      <button role="tab" aria-selected="false" class="tab-btn">👤 Analyze Profile</button>
      <button role="tab" aria-selected="true" class="tab-btn active">⚔️ Compare Repos</button>
    </div>

    <section class="search-card">
      <form id="compare-form" onsubmit="return false;">
        <label for="repo-input" class="sr-only">Enter repository full names</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="repo-input" 
            placeholder="e.g. facebook/react, vuejs/vue"
            aria-describedby="input-hint"
          />
          <button type="submit" id="compare-btn" class="btn-primary">Compare Directly</button>
        </div>
      </form>

      <p id="input-hint" class="hint-text">
        Pro-tip: Enter 2 or 3 repository full names separated by commas to run direct comparison.
      </p>

      <div class="history-section">
        <button id="clear-history" class="btn-secondary">Clear History</button>
        <div class="history-tags">
          <span class="label">Search History:</span>
          <div id="tags-container" class="tags-container"></div>
        </div>
      </div>
    </section>

    <!-- Error State Container -->
    <section id="error-container" class="error-card hidden" aria-live="polite">
      <span class="warning-icon" aria-hidden="true">⚠️</span>
      <h2 class="error-title">Comparison Error</h2>
      <p id="error-message" class="error-message"></p>
      <button id="retry-btn" class="btn-primary">Try Again</button>
    </section>

    <!-- Success Output Container -->
    <section id="results-container" class="results-grid hidden" aria-live="polite">
      <!-- Dynamic comparison cards inserted via script.js -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
